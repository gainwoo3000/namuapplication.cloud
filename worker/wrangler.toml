# Cloudflare Worker: 시세 프록시 (CoinMarketCap KRW + CoinGecko 시세목록/검색)
# 배포: 이 디렉터리에서  npx wrangler deploy   (자세한 순서는 README.md)

name = "coinwatch-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# api.namuapplication.cloud 로 서비스.
# custom_domain = true 이면 wrangler가 배포할 때 DNS 레코드와 인증서를 자동으로 만든다.
# (namuapplication.cloud 존이 wrangler login 하는 Cloudflare 계정에 있어야 함)
routes = [
  { pattern = "api.namuapplication.cloud", custom_domain = true }
]

[vars]
# 이 오리진에서 오는 브라우저 요청만 허용 (CORS). 로컬 테스트가 필요하면 잠시 "*" 로.
ALLOW_ORIGIN = "https://namuapplication.cloud"
# CMC 응답을 엣지에 캐시할 시간(초). 크레딧을 아끼는 핵심 값. 600 = 10분.
CMC_TTL_SECONDS = "600"
# CoinGecko 시총 500위 목록(/cg/markets)을 엣지에 캐시할 시간(초).
# 무료(Demo) 한도가 월 1만 콜이고 갱신 1회당 2콜(250개씩 2페이지)을 쓴다.
#   60초  -> 월 86,400콜 (한도 8.6배 초과)
#   900초 -> 월  5,760콜 (POP 1곳 기준. 접속 지역이 늘면 그만큼 곱해진다)
# 가격·등락률은 클라이언트가 거래소 티커로 덮어쓰므로(applyExchangeTickers),
# 이 캐시가 길어도 화면 숫자는 실시간이다. 낡는 건 순위·이름과 거래소 미상장 코인 가격뿐.
CG_MARKETS_TTL = "900"
# CoinGecko 코인 검색(/cg/search)을 엣지에 캐시할 시간(초). 검색어별로 따로 캐시된다.
# 미스 1회당 2콜(검색 + 가격조회)이라 방문이 늘수록 여기가 한도를 먼저 잡아먹는다.
# 3600 = 같은 검색어는 하루 최대 24회만 업스트림에 나간다.
CG_SEARCH_TTL = "3600"

# 비밀값은 여기 두지 않는다. 아래 명령으로 등록:
#   npx wrangler secret put CMC_KEY
#   npx wrangler secret put CG_KEY   # (선택) CoinGecko Demo 키 — 있으면 검색 한도가 넉넉해짐
