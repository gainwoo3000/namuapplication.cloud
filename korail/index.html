<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>사고사례 환류관리</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 상단 바(양식 선택 · 작성/결과/규정 전환 · 로그인) + 가운데 양식 카드 열. 결과·규정은 넓은 열 */
:root{
  --bg:#eef1f3; --surface:#ffffff; --surface-2:#e6eaed; --line:#d3dade;
  --fg:#16202a; --muted:#5a6872; --accent:#0e5a78; --accent-soft:#dbeaf1; --on-accent:#ffffff;
  --red:#b02a20; --red-soft:#fbe3df; --amber:#8f5a00; --amber-soft:#faedd2;
  --green:#1b673b; --green-soft:#dcefe2; --grey:#8a979f;
  --c1:#2f6db3; --c2:#c8691f; --c3:#2a8468; --c4:#8a57b3; --c5:#bd4274; --c6:#7a8791;
  --f-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1418; --surface:#151d23; --surface-2:#1d272e; --line:#29353e;
  --fg:#e2e8ec; --muted:#93a1ab; --accent:#62b4d4; --accent-soft:#15303c; --on-accent:#0b1b22;
  --red:#ef8a7f; --red-soft:#3a1c18; --amber:#e3b45c; --amber-soft:#33280f;
  --green:#7cc896; --green-soft:#14301f; --grey:#6c7a84;
  --c1:#6fa4e6; --c2:#eb9a5c; --c3:#5cc0a0; --c4:#b88ee0; --c5:#e57aa5; --c6:#8d9aa3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1418; --surface:#151d23; --surface-2:#1d272e; --line:#29353e;
  --fg:#e2e8ec; --muted:#93a1ab; --accent:#62b4d4; --accent-soft:#15303c; --on-accent:#0b1b22;
  --red:#ef8a7f; --red-soft:#3a1c18; --amber:#e3b45c; --amber-soft:#33280f;
  --green:#7cc896; --green-soft:#14301f; --grey:#6c7a84;
  --c1:#6fa4e6; --c2:#eb9a5c; --c3:#5cc0a0; --c4:#b88ee0; --c5:#e57aa5; --c6:#8d9aa3; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.6}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

/* 상단 바 */
body{padding-top:env(safe-area-inset-top,0px)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.brand-mark{width:26px;height:26px;border-radius:50%;border:3px solid var(--accent);display:grid;place-items:center;flex:none}
.brand-mark::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.brand b{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1;white-space:nowrap}
.ver{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;white-space:nowrap}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);min-width:0}
.who span{max-width:16ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:7px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:500}
.tabs button:hover{color:var(--fg);background:var(--surface-2)}
.tabs button[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft);font-weight:700}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.mode button{border:0;background:var(--surface);padding:7px 13px;cursor:pointer;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap}
.mode button+button{border-left:1px solid var(--line)}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.badge{font-family:var(--f-mono);font-size:11.5px;border-radius:99px;padding:0 7px;background:var(--surface-2);color:var(--fg)}
.mode button[aria-pressed="true"] .badge{background:var(--on-accent);color:var(--accent)}

.wrap{padding-block:26px calc(72px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.col.wide{max-width:1100px}

/* 양식 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.form-head{border-top:8px solid var(--accent)}
.form-head h1{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.2;margin:0;text-wrap:balance}
.form-head p{margin:0;color:var(--muted);max-width:62ch}
.req-note{font-size:12.5px;color:var(--red)}
.sec-title{padding:12px 4px 0}
.sec-title .no,.eyebrow{font-family:var(--f-mono);font-size:12px;color:var(--accent);letter-spacing:.04em}
.sec-title h2{font-size:18px;margin:2px 0 0;text-wrap:balance}
.sec-title p{margin:4px 0 0;color:var(--muted);font-size:13px}
.q{transition:border-color .15s}
.q:focus-within{border-color:var(--accent)}
.q.err{border-color:var(--red)}
.q-label{font-weight:600;font-size:15px}
.q-label .star{color:var(--red);margin-left:3px}
.q-help{font-size:12.5px;color:var(--muted);margin-top:-6px}
.q-err{color:var(--red);font-size:12.5px;font-weight:500}
.inp{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 2px;border-radius:0}
.inp:focus{outline:none;border-bottom:2px solid var(--accent);padding-bottom:7px}
textarea.inp{resize:vertical;min-height:72px;line-height:1.6}
input[type=date].inp,input[type=datetime-local].inp{width:auto;min-width:200px}
.box{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 10px;min-width:0}
textarea.box{resize:vertical;line-height:1.55}
select.box{padding:7px 8px}
.opts{display:flex;flex-direction:column;gap:2px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:7px 4px;border-radius:6px;cursor:pointer}
.opt:hover{background:var(--surface-2)}
.opt input{margin-top:4px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.opt small{display:block;color:var(--muted);font-size:12.5px}
.opt .other{flex:1;min-width:0}
.grid-q{overflow-x:auto}
.grid-q table{border-collapse:collapse;width:100%;min-width:480px}
.grid-q th{font-size:12.5px;font-weight:500;color:var(--muted);padding:6px;text-align:center}
.grid-q td{padding:9px 6px;border-top:1px solid var(--line);text-align:center}
.grid-q td:first-child{text-align:left;font-size:13.5px}
.grid-q input{width:17px;height:17px;accent-color:var(--accent)}
.scale{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.scale label{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 10px;cursor:pointer;font-family:var(--f-mono)}
.scale input{width:18px;height:18px;accent-color:var(--accent)}
.scale .end{font-size:12.5px;color:var(--muted)}
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:4px}

/* 사진 */
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:96px;height:96px;margin:0;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.thumb img.broken{opacity:0}
.thumb .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);cursor:pointer;line-height:1;font-size:15px}
.ph-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* 위반 법령 */
.vio-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ai-msg{font-size:13px;padding:9px 12px;border-radius:8px;background:var(--accent-soft)}
.ai-msg.warn{background:var(--amber-soft)}
.vrow{border:1px solid var(--line);border-radius:9px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.vrow-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vrow-head .sp{margin-left:auto}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vgrid .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;color:var(--muted);font-weight:600}
.art-text{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:7px;padding:8px 10px;white-space:pre-wrap;max-height:9em;overflow:auto}
.reason{font-size:12.5px;color:var(--muted)}
.reason b{color:var(--fg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);padding:9px 22px}
.btn.primary:hover{filter:brightness(1.08);color:var(--on-accent)}
.btn.soft{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--accent)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.notice{display:flex;gap:10px;padding:11px 14px;border-radius:8px;font-size:13.5px;background:var(--amber-soft);flex-wrap:wrap;align-items:center}
.notice b{color:var(--amber);flex:none}
.notice span{flex:1 1 260px}
.notice.info{background:var(--accent-soft)}
.notice.info b{color:var(--accent)}
.done-card{align-items:flex-start}
.done-card h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
code{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}

/* 결과 */
.res-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.res-head h1{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;line-height:1.2}
.res-head p{margin:2px 0 0;color:var(--muted);max-width:70ch}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.subtabs button{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subtabs button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.sum-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.sum-grid .span{grid-column:1/-1}
.meta{color:var(--muted);font-size:12.5px}
.card-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.card-head h3{margin:0;font-size:15px}
.bars{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 62px;gap:10px;align-items:center;font-size:13px}
.brow .lab{min-width:0;overflow-wrap:anywhere}
.brow .lab.ok{font-weight:700;color:var(--green)}
.track{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px}
.brow .n{font-family:var(--f-mono);text-align:right;font-size:12.5px;white-space:nowrap}
.stack-row{display:flex;flex-direction:column;gap:4px;font-size:13px}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend span::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c)}
.c-green{--c:var(--green)} .c-red{--c:var(--red)} .c-amber{--c:var(--amber)} .c-grey{--c:var(--grey)}
.texts{display:flex;flex-direction:column}
.texts div{padding:8px 0;border-top:1px solid var(--line);font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.texts div:first-child{border-top:0}
.texts small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:11.5px}
.big{font-family:var(--f-mono);font-size:30px;line-height:1}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--fg);font-size:16px}

.pager{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ans{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.ans:first-of-type{border-top:0}
.ans .k{font-size:12.5px;color:var(--muted);font-weight:500}
.ans .v{white-space:pre-wrap;overflow-wrap:anywhere}
.none{color:var(--muted)}
.pill{display:inline-flex;align-items:center;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.p-green{background:var(--green-soft);color:var(--green)} .p-red{background:var(--red-soft);color:var(--red)}
.p-amber{background:var(--amber-soft);color:var(--amber)} .p-grey{background:var(--surface-2);color:var(--muted)}
.mini{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:1px 8px;font-size:12.5px;white-space:nowrap}
.vlist{display:flex;flex-direction:column;gap:8px;white-space:normal}
.vlist>div{border-left:3px solid var(--red);padding:2px 0 2px 10px}
.vlist .pen{display:block;font-size:12.5px;color:var(--red);font-weight:600}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.table-wrap table{border-collapse:collapse;font-size:12.5px;min-width:100%}
.table-wrap th{background:var(--surface-2);text-align:left;padding:8px 10px;font-weight:600;color:var(--muted);white-space:nowrap}
.table-wrap td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top;min-width:110px;max-width:280px;overflow-wrap:anywhere;white-space:pre-wrap}
.table-wrap tr.rowlink:hover td{background:var(--accent-soft)}

/* 통계 */
.stat-ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi b{font-family:var(--f-mono);font-size:26px;font-weight:500;line-height:1.2}
.kpi em{font-style:normal;font-size:12.5px;overflow-wrap:anywhere}
.chart-scroll{overflow-x:auto}
.cc{min-width:calc(var(--n) * 40px + 30px)}
.cc-plot{display:grid;grid-template-columns:repeat(var(--n),minmax(28px,1fr));gap:6px;height:190px;border-bottom:1px solid var(--line);
  background:repeating-linear-gradient(to top,transparent 0,transparent 47px,var(--surface-2) 47px,var(--surface-2) 48px)}
.cc-col{display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;min-width:0}
.cc-total{font-family:var(--f-mono);font-size:11.5px;text-align:center;color:var(--fg);line-height:1.6}
.cc-stack{display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden;min-height:0}
.cc-stack i{display:block;min-height:2px}
.cc-labels{display:grid;grid-template-columns:repeat(var(--n),minmax(28px,1fr));gap:6px;margin-top:6px}
.cc-labels span{font-size:11.5px;color:var(--muted);text-align:center;font-family:var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xt td,.xt th{text-align:center;min-width:56px;max-width:none;white-space:nowrap}
.xt td:first-child,.xt th:first-child{text-align:left;min-width:150px;white-space:normal}
.xt td.z{color:var(--muted)}
.xt td.tot,.xt th.tot{font-weight:700;border-left:1px solid var(--line)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:baseline}

/* 사례 요약 */
.sumlist{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column}
.sumlist li{counter-increment:s;display:grid;grid-template-columns:148px minmax(0,1fr);gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.sumlist li:first-child{border-top:0}
.sumlist .k{font-weight:600;font-size:13.5px}
.sumlist .k::before{content:counter(s) ". ";font-family:var(--f-mono);color:var(--accent)}
.sumlist .v{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.ai-box{border:1px dashed var(--accent);border-radius:9px;padding:12px 14px;white-space:pre-wrap;font-size:14px}
.ai-box .meta{display:block;margin-top:6px}

/* 규정 */
.reg{gap:10px}
.reg-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.reg-head h3{margin:0;font-size:16px}
.reg-head .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.reg-toggle{border:0;background:none;padding:0;cursor:pointer;display:flex;gap:10px;align-items:center;text-align:left}
.reg-toggle .arr{font-family:var(--f-mono);color:var(--muted);width:14px}
.editor{border:1px solid var(--accent);border-radius:9px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.admins{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.lb{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.78);display:grid;place-items:center;cursor:zoom-out;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:100%;border-radius:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:80;max-width:calc(100% - 32px)}

function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200);}
const pad=n=>String(n).padStart(2,'0');
const fmtTime=iso=>{if(!iso)return'';const d=new Date(iso);if(isNaN(d))return esc(iso);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;};
const isEmpty=v=>v==null||v===''||(Array.isArray(v)&&(!v.length||v.every(x=>x===''||x==null)));
const lsGet=k=>{try{return JSON.parse(localStorage.getItem('korail:'+k)||'null');}catch(e){return null;}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem('korail:'+k):localStorage.setItem('korail:'+k,JSON.stringify(v));}catch(e){}};
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));
const artKey=no=>{const m=String(no||'').match(/제\s*(\d+)\s*조(?:\s*의\s*(\d+))?(?:\s*제\s*(\d+)\s*항)?/);return m?[+m[1],+(m[2]||0),+(m[3]||0)]:[99999,0,0];};
const sortArts=a=>[...(a||[])].sort((x,y)=>{const p=artKey(x.no),q=artKey(y.no);return p[0]-q[0]||p[1]-q[1]||p[2]-q[2];});
const formatPenalty=a=>a&&a.penalty?`${a.penaltyType?`[${a.penaltyType}] `:''}${a.penalty}${a.penaltyBasis?` (근거: ${a.penaltyBasis})`:''}`:'';
const violLabel=v=>`${v.regName||'규정 미선택'} ${v.articleNo||''}`.trim();
const errCode=e=>String(e&&e.code||'').replace(/^(firestore|storage|functions|auth)\//,'');
const photoSrc=p=>p&&p.url?p.url:'';

/* ───────── 작성 화면 ───────── */
function fieldHTML(f,form){
  const id=`q-${form.id}-${f.id}`, star=f.req?'<span class="star" aria-hidden="true">*</span>':'';
  let body='';
  if(f.type==='short') body=`<input class="inp" type="text" id="${id}" name="${f.id}" placeholder="${esc(f.ph||'내 답변')}">`;
  else if(f.type==='long') body=`<textarea class="inp" id="${id}" name="${f.id}" rows="3" placeholder="${esc(f.ph||'내 답변')}"></textarea>`;
  else if(f.type==='date') body=`<input class="inp" type="date" id="${id}" name="${f.id}">`;
  else if(f.type==='datetime') body=`<input class="inp" type="datetime-local" id="${id}" name="${f.id}">`;
  else if(f.type==='radio'||f.type==='checkbox'){
    const t=f.type;
    body=`<div class="opts" role="${t==='radio'?'radiogroup':'group'}" aria-labelledby="${id}-l">${f.options.map((o,i)=>{const v=optV(o);
      return `<label class="opt"><input type="${t}" id="${id}-${i}" name="${f.id}" value="${esc(v)}"><span>${esc(v)}${o.d?`<small>${esc(o.d)}</small>`:''}</span></label>`;}).join('')}
      ${f.other?`<label class="opt"><input type="${t}" id="${id}-o" name="${f.id}" value="__other"><span>기타:</span><input class="inp other" type="text" id="${id}-ot" name="${f.id}__ot" aria-label="기타 내용"></label>`:''}</div>`;
  }
  else if(f.type==='grid') body=`<div class="grid-q"><table><thead><tr><th></th>${f.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>
    ${f.rows.map((r,i)=>`<tr><td>${esc(r)}</td>${f.cols.map((c,j)=>`<td><input type="radio" id="${id}-${i}-${j}" name="${f.id}__${i}" value="${esc(c)}" aria-label="${esc(r)}: ${c}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  else if(f.type==='scale'){const n=[];for(let v=f.min;v<=f.max;v++)n.push(v);
    body=`<div class="scale" role="radiogroup" aria-labelledby="${id}-l"><span class="end">${esc(f.minLabel)}</span>${n.map(v=>`<label><span>${v}</span><input type="radio" id="${id}-${v}" name="${f.id}" value="${v}"></label>`).join('')}<span class="end">${esc(f.maxLabel)}</span></div>`;}
  else if(f.type==='photos') body=`<div id="ph-box" style="display:flex;flex-direction:column;gap:10px"></div>`;
  else if(f.type==='violations') body=`<div id="vio-box" style="display:flex;flex-direction:column;gap:12px"></div>`;
  return `<div class="card q" id="${id}-card" data-fid="${f.id}"><div class="q-label" id="${id}-l">${esc(f.label)}${star}</div>${f.help?`<div class="q-help">${esc(f.help)}</div>`:''}${body}<div class="q-err" hidden></div></div>`;
}
function statusNotice(){
  if(S.conn==='pending') return `<div class="notice info"><b>연결 중</b><span>저장소에 연결하고 있습니다.</span></div>`;
  if(S.conn==='setup') return `<div class="notice"><b>설정 필요</b><span>Firebase 설정값이 아직 비어 있어 응답을 저장할 수 없습니다. 관리자는 <code>korail-firebase/README.md</code>의 순서대로 설정해 주세요.</span></div>`;
  if(S.conn==='error') return `<div class="notice"><b>연결 실패</b><span>${esc(S.connErr||'저장소에 연결하지 못했습니다. 잠시 후 새로고침해 주세요.')}</span></div>`;
  if(S.conn==='signedout') return `<div class="notice info"><b>로그인 필요</b><span>응답을 제출하려면 로그인하세요. 작성 중인 내용은 이 브라우저에 임시 보관됩니다.</span><button type="button" class="btn sm" data-act="signIn">Google 로그인</button></div>`;
  return '';
}

function renderPhotos(){

    <div class="ph-tools">${ready()?`<label class="btn sm" for="photo-file">사진 추가</label><input type="file" id="photo-file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden data-photo>`:
      `<span class="meta">${S.conn==='pending'?'사진 업로드를 준비하고 있습니다.':'로그인하면 사진을 올릴 수 있습니다.'}</span>`}
      <span class="meta mono">${list.length} / 10장</span></div>`;
}
async function uploadPhotos(files){
  const {storage,st}=S.fb;
  const formId=S.form;
  const list=S.photos[formId]||(S.photos[formId]=[]);
  const ok={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'};
  for(const file of files){
    if(list.length>=10){toast('사진은 최대 10장까지 올릴 수 있습니다');break;}
    if(!ok[file.type]){toast(`${file.name}: JPG, PNG, WEBP, GIF 사진만 올릴 수 있습니다`);continue;}
    if(file.size>20*1024*1024){toast(`${file.name}: 20MB를 넘는 사진은 올릴 수 없습니다`);continue;}
    S.upBusy++;renderPhotos();updateSubmitBtn();
    try{
      const path=`photos/${S.user.uid}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ok[file.type]}`;
      const r=st.ref(storage,path);
      await st.uploadBytes(r,file,{contentType:file.type});
      const url=await st.getDownloadURL(r);
      list.push({path,url});
    }catch(e){const c=errCode(e);
      toast(c==='unauthorized'?'사진을 올릴 권한이 없습니다. 다시 로그인해 보세요':c==='quota-exceeded'?'사진 저장 공간이 가득 찼습니다':c==='retry-limit-exceeded'?'네트워크가 불안정합니다. 다시 올려 주세요':'사진을 올리지 못했습니다');}
    finally{S.upBusy--;}
  }
  renderPhotos();updateSubmitBtn();saveDraft();
}
function deletePhoto(p){if(!p||!p.path||!S.fb||!S.user)return;const {storage,st}=S.fb;st.deleteObject(st.ref(storage,p.path)).catch(()=>{});}

function violRowHTML(r,i){

      <button type="button" class="btn sm ghost sp" data-act="rmViol" data-i="${i}">삭제</button></div>
    <div class="vgrid">
      <label class="fld"><span>규정</span><select class="box" id="v-${i}-reg" data-v="regId" data-i="${i}">${regOptions(r.regId)}</select></label>
      ${r.regId==='__custom'?`<label class="fld"><span>규정명</span><input class="box" type="text" id="v-${i}-regname" data-v="regName" data-i="${i}" value="${esc(r.regName)}"></label>`:
        `<label class="fld"><span>조문</span><select class="box" id="v-${i}-art" data-v="articleId" data-i="${i}" ${reg?'':'disabled'}>
          <option value="">조문 선택</option>${arts.map(a=>`<option value="${esc(a.id)}" ${a.id===r.articleId?'selected':''}>${esc(a.no)}${a.title?` (${esc(a.title)})`:''}</option>`).join('')}
          <option value="__custom" ${r.articleId==='__custom'?'selected':''}>목록에 없는 조문 (직접 입력)</option></select></label>`}
      ${customArt?`<label class="fld ${r.regId==='__custom'?'':'full'}"><span>조문 · 항 · 호</span><input class="box" type="text" id="v-${i}-no" data-v="articleNo" data-i="${i}" value="${esc(r.articleNo)}" placeholder="원문에서 확인한 조문 (확인 전이면 ‘조문 확인 필요’)"></label>`:''}
      ${art&&art.text?`<div class="art-text full">${esc(art.text)}</div>`:''}
      <label class="fld"><span>규정상 의무</span><textarea class="box" rows="2" id="v-${i}-duty" data-v="duty" data-i="${i}">${esc(r.duty)}</textarea></label>
      <label class="fld"><span>실제 행위와의 차이</span><textarea class="box" rows="2" id="v-${i}-gap" data-v="gap" data-i="${i}">${esc(r.gap)}</textarea></label>
      <label class="fld full"><span>처벌 조항 (과태료 · 벌칙 · 징계 등)</span><textarea class="box" rows="2" id="v-${i}-pen" data-v="penalty" data-i="${i}" placeholder="등록된 조문에 처벌 조항이 있으면 자동으로 채워집니다. 해당 없으면 비워 두세요.">${esc(r.penalty)}</textarea></label>
    </div>
    ${r.reason?`<div class="reason"><b>판단 근거</b> ${esc(r.reason)}</div>`:''}</div>`;
}
function onViolChange(el){
  const i=+el.dataset.i,k=el.dataset.v,rows=S.viol[S.form];if(!rows||!rows[i])return;const r=rows[i];
  if(k==='regId'){r.regId=el.value;const reg=S.regs.find(x=>x.id===el.value);r.regName=reg?reg.name:'';r.articleId='';r.articleNo='';r.articleTitle='';r.penalty='';r.effective='';renderViol();}
  else if(k==='articleId'){r.articleId=el.value;const reg=S.regs.find(x=>x.id===r.regId);const a=reg&&(reg.articles||[]).find(x=>x.id===el.value);
    if(a){r.articleNo=a.no;r.articleTitle=a.title||'';r.penalty=formatPenalty(a);r.effective=a.effective||'';}else{r.articleNo='';r.articleTitle='';}
    renderViol();}
  else r[k]=el.value;
  saveDraft();
}
function collectViol(form){
  return (S.viol[form.id]||[]).filter(r=>r.regName||r.articleNo||r.duty||r.gap||r.penalty).map(r=>({
    regId:r.regId||'',regName:r.regName||'',articleId:r.articleId||'',articleNo:r.articleNo||'',articleTitle:r.articleTitle||'',
    duty:(r.duty||'').trim(),gap:(r.gap||'').trim(),penalty:(r.penalty||'').trim(),effective:r.effective||'',
    source:r.source||'manual',reason:r.reason||'',confidence:r.confidence||''}));
}
/* AI 호출 공통: 서버(Cloud Functions)의 claude 함수가 API 키를 들고 대신 호출한다 */
async function callAI(payload){
  const {fn}=S.fb;
  const res=await fn.claudeCall(payload);
  return res.data||{};
}
function aiErrorText(e){
  const c=errCode(e);
  if(c==='not-found'){S.aiEnabled=false;return '자동 기능이 아직 배포되지 않았습니다. 관리자에게 Functions 배포를 요청하세요.';}
  if(c==='failed-precondition')return e.message||'자동 기능 설정을 확인해야 합니다. 관리자에게 알려 주세요.';
  if(c==='internal'){const m=String(e.message||'').trim();
    return !m||m==='internal'?'자동 기능 서버에 연결하지 못했습니다. Functions가 배포되어 있는지 관리자에게 확인하세요.':m;}
  if(c==='resource-exhausted')return e.message||'오늘 사용 한도에 도달했습니다. 내일 다시 시도하세요.';
  if(c==='unauthenticated')return '로그인이 만료되었습니다. 다시 로그인한 뒤 시도하세요.';
  if(c==='deadline-exceeded')return '응답이 늦어 중단했습니다. 다시 시도하세요.';
  if(c==='invalid-argument')return e.message||'요청 내용을 확인하세요.';
  return '자동 처리에 실패했습니다. 잠시 후 다시 시도하세요.';
}
async function aiFill(){
  const form=curForm(),A=collect(form);
  if(!A.summary){toast('사고 경위를 먼저 적어 주세요');document.getElementById(`q-${form.id}-summary`)?.focus();return;}
  if(!aiReady()||S.aiBusy)return;
  const acts=fieldById(form,'acts');
  const library=S.regs.map(r=>({regId:r.id,name:r.name,kind:r.kind||'',articles:sortArts(r.articles).map(a=>({articleId:a.id,no:a.no,title:a.title||'',text:String(a.text||'').slice(0,700),hasPenalty:!!a.penalty}))}));

    const rows=[];
    list.slice(0,6).forEach(v=>{const reg=S.regs.find(r=>r.id===String(v&&v.regId));if(!reg)return;

        duty:String(v.duty||''),gap:String(v.gap||''),penalty:a?formatPenalty(a):'',effective:a?(a.effective||''):'',reason:String(v.reason||''),

    S.aiWarn=!rows.length;
  }catch(e){if(token!==S.aiToken)return;S.aiWarn=true;S.aiMsg=aiErrorText(e);}
  finally{if(token===S.aiToken){S.aiBusy=false;renderViol();saveDraft();}}
}

function collect(form){
  const el=$('#form'),A={};
  fieldsOf(form).forEach(f=>{
    if(['short','long','date','datetime'].includes(f.type)) A[f.id]=el.querySelector(`[name="${f.id}"]`).value.trim();
    else if(f.type==='radio'||f.type==='scale'){const c=el.querySelector(`input[name="${f.id}"]:checked`);let v=c?c.value:'';
      if(v==='__other'){const t=el.querySelector(`[name="${f.id}__ot"]`).value.trim();v=t?`기타: ${t}`:'기타';}
      A[f.id]=f.type==='scale'&&v?Number(v):v;}
    else if(f.type==='checkbox') A[f.id]=[...el.querySelectorAll(`input[name="${f.id}"]:checked`)].map(c=>{
      if(c.value!=='__other')return c.value;const t=el.querySelector(`[name="${f.id}__ot"]`).value.trim();return t?`기타: ${t}`:'기타';});
    else if(f.type==='grid') A[f.id]=f.rows.map((_,i)=>{const c=el.querySelector(`input[name="${f.id}__${i}"]:checked`);return c?c.value:'';});
    else if(f.type==='photos') A[f.id]=(S.photos[form.id]||[]).map(p=>({path:p.path,url:p.url}));
    else if(f.type==='violations') A[f.id]=collectViol(form);
  });
  return A;
}
function applyAnswers(form,A){
  const el=$('#form'); if(!el) return;
  if(!S.stateInit[form.id]){S.stateInit[form.id]=true;
    S.photos[form.id]=A&&Array.isArray(A.photos)?clone(A.photos).filter(p=>p&&p.url):[];
    S.viol[form.id]=A&&Array.isArray(A.violations)?clone(A.violations):[];}
  renderPhotos();renderViol();
  if(!A) return;
  const setChoice=(name,v,f)=>{const vals=f.options?f.options.map(optV):[];
    if(typeof v==='string'&&v.startsWith('기타')&&f.other&&!vals.includes(v)){const o=el.querySelector(`input[name="${name}"][value="__other"]`);if(o)o.checked=true;
      const t=el.querySelector(`[name="${name}__ot"]`);if(t)t.value=v.replace(/^기타:?\s?/,'');return;}
    el.querySelectorAll(`input[name="${name}"]`).forEach(i=>{if(i.value===String(v))i.checked=true;});};
  fieldsOf(form).forEach(f=>{const v=A[f.id];if(isEmpty(v))return;
    if(['short','long','date','datetime'].includes(f.type)){const i=el.querySelector(`[name="${f.id}"]`);if(i)i.value=v;}
    else if(f.type==='radio'||f.type==='scale') setChoice(f.id,v,f);
    else if(f.type==='checkbox') v.forEach(x=>setChoice(f.id,x,f));
    else if(f.type==='grid') v.forEach((x,i)=>{if(x){const r=el.querySelector(`input[name="${f.id}__${i}"][value="${CSS.escape(x)}"]`);if(r)r.checked=true;}});
  });
}
function validate(form,A){
  let first=null;
  fieldsOf(form).forEach(f=>{const card=document.getElementById(`q-${form.id}-${f.id}-card`);if(!card)return;const msg=card.querySelector('.q-err');
    let bad='';
    if(f.req&&isEmpty(A[f.id])) bad='필수 항목입니다.';
    if(f.req&&f.type==='grid'&&A[f.id].some(x=>!x)) bad='모든 행에 답해 주세요.';
    card.classList.toggle('err',!!bad); msg.hidden=!bad; msg.textContent=bad;

async function submit(){
  const form=curForm(),A=collect(form);
  if(!validate(form,A)){toast('입력하지 않은 필수 항목이 있습니다');return;}
  if(!canSubmit()){if(S.conn==='signedout')toast('로그인한 뒤 제출하세요');return;}
  S.busy=true;updateSubmitBtn();
  const {db,fs}=S.fb;
  const ref=fs.doc(fs.collection(db,'forms',form.id,'responses'));
  const body={answers:A,submittedAt:new Date().toISOString(),by:S.user.uid,byName:S.user.displayName||'',byEmail:S.user.email||''};
  try{
    try{await fs.setDoc(ref,body);}
    catch(e){if(errCode(e)==='unavailable'){await new Promise(r=>setTimeout(r,700));await fs.setDoc(ref,body);}else throw e;}
    lsSet('draft:'+form.id,null);S.photos[form.id]=[];S.viol[form.id]=[];S.aiMsg='';
    S.submitted=form.id;S.busy=false;renderMain();window.scrollTo(0,0);toast('응답을 제출했습니다');

    if(c==='permission-denied'||c==='unauthenticated')toast('이 계정으로는 응답을 저장할 수 없습니다. 다시 로그인해 보세요. 작성한 내용은 남아 있습니다');
    else if(c==='resource-exhausted')toast('요청이 많아 저장하지 못했습니다. 잠시 후 다시 제출하세요');

    else toast('일시적으로 저장하지 못했습니다. 잠시 후 다시 제출하세요');
  }
}

function countChoice(f,list){

function violCounts(list){

  const recs=all.filter(x=>mode==='year'||S.statYear==='all'||x.d.y===+S.statYear).map(x=>({...x,k:keyOf(x.d,mode)}));
  const periods=periodRange(recs.map(x=>x.d),mode);
  const ctl=`<div class="stat-ctl"><span class="seg" role="group" aria-label="집계 단위">${[['year','연도별'],['quarter','분기별'],['month','월별']].map(([k,l])=>`<button type="button" data-act="statPeriod" data-p="${k}" aria-pressed="${mode===k}">${l}</button>`).join('')}</span>
    ${mode!=='year'?`<select class="box" id="stat-year" data-chg="statYear" style="width:auto" aria-label="연도">${years.map(y=>`<option value="${y}" ${String(y)===S.statYear?'selected':''}>${y}년</option>`).join('')}<option value="all" ${S.statYear==='all'?'selected':''}>전체 기간</option></select>`:''}
    <span class="meta">기준: ${esc(fieldById(form,st.date).label)}</span></div>`;
  if(!recs.length) return ctl+`<div class="card empty"><b>집계할 응답이 없습니다</b><span>${esc(fieldById(form,st.date).label)}이(가) 입력된 응답이 있으면 기간별 통계가 표시됩니다.</span></div>`;
  const [d0,d1]=st.dims;
  const A=dimCats(form,d0[0],recs),B=dimCats(form,d1[0],recs);
  const catColor=(c,j)=>`var(--c${Math.min(j+1,6)})`;
  const semColor=(f)=>(c,j)=>{const i=f.options.map(optV).indexOf(c);return f.colors&&i>=0?`var(--${f.colors[i]})`:`var(--c${Math.min(j+1,6)})`;};
  const topOf=(f,cats)=>{const cnt=cats.map(c=>[c,recs.filter(x=>catOf(f,x.r.answers?.[f.id])===c).length]).sort((a,b)=>b[1]-a[1]);return cnt[0]&&cnt[0][1]?cnt[0]:null;};
  const t0=topOf(A.f,A.cats);
  let kpis=`<div class="kpi"><span>대상 건수</span><b>${recs.length}</b><em class="meta">${periods.length?`${esc(labelOf(periods[0],mode))} ~ ${esc(labelOf(periods[periods.length-1],mode))}`:''}</em></div>
    <div class="kpi"><span>가장 많은 ${esc(d0[1])}</span><b>${t0?t0[1]:0}</b><em>${t0?esc(t0[0]):'—'}</em></div>`;
  let vc=[];
  if(st.viol){
    vc=violCounts(recs.map(x=>x.r));
    const conf=recs.filter(x=>x.r.answers?.verdict==='위반 확인').length;
    kpis+=`<div class="kpi"><span>위반 확인</span><b>${conf}</b><em class="meta">대상 대비 ${Math.round(conf/recs.length*100)}%</em></div>
      <div class="kpi"><span>가장 많이 위반된 조문</span><b>${vc[0]?vc[0].count:0}</b><em>${vc[0]?esc(vc[0].label):'—'}</em></div>`;
  } else {const t1=topOf(B.f,B.cats);
    kpis+=`<div class="kpi"><span>가장 많은 ${esc(d1[1])}</span><b>${t1?t1[1]:0}</b><em>${t1?esc(t1[0]):'—'}</em></div><div class="kpi"><span>기간 수</span><b>${periods.length}</b><em class="meta">${mode==='year'?'년':mode==='quarter'?'분기':'개월'}</em></div>`;}
  const rowsFor=(D,color)=>D.cats.map((c,j)=>({head:`<span class="sw" style="background:${color(c,j)}"></span>${esc(c)}`,vals:periods.map(p=>recs.filter(x=>x.k===p&&catOf(D.f,x.r.answers?.[D.f.id])===c).length)}));
  let html=ctl+`<div class="kpis">${kpis}</div>
    <div class="card"><div class="card-head"><h3>기간별 ${form.id==='accident'?'발생 건수':'응답 수'} · ${esc(d0[1])}</h3><span class="meta">${mode==='year'?'연도별':mode==='quarter'?'분기별':'월별'}</span></div>${colChart(periods,mode,recs,A.f,A.cats,catColor)}</div>
    <div class="card"><div class="card-head"><h3>${esc(d0[1])} × 기간</h3></div>${crossTable(rowsFor(A,catColor),periods,mode)}</div>
    <div class="card"><div class="card-head"><h3>${esc(d1[1])} × 기간</h3></div>${crossTable(rowsFor(B,semColor(B.f)),periods,mode)}</div>`;
  if(st.viol){
    html+=`<div class="card"><div class="card-head"><h3>위반 법령 · 조문 × 기간</h3><span class="meta">한 사례에 같은 조문이 여러 번 적혀도 1건으로 셉니다</span></div>
      ${vc.length?crossTable(vc.map(v=>({head:`<b>${esc(v.reg)}</b> ${esc(v.no)}${v.penalty?`<br><span class="meta" style="color:var(--red)">처벌: ${esc(v.penalty)}</span>`:''}`,
        vals:periods.map(p=>v.rows.filter(r=>keyOf(dateOf(form,r),mode)===p).length)})),periods,mode):'<span class="meta">이 기간에 기록된 위반 조문이 없습니다.</span>'}</div>`;
    const byReg=new Map();vc.forEach(v=>byReg.set(v.reg||'규정 미선택',(byReg.get(v.reg||'규정 미선택')||0)+v.count));
    if(byReg.size)html+=`<div class="card"><div class="card-head"><h3>규정별 위반 건수</h3></div>${barRows([...byReg.entries()].sort((a,b)=>b[1]-a[1]).map(([k,n])=>[k,n,'red']),recs.length)}</div>`;
  }
  return html;
}

  const mo=[A.owner?`담당 ${A.owner}`:'',A.due?`기한 ${A.due}`:''].filter(Boolean).join(' · ');

    ['발생 일시',esc(String(A.when||'').replace('T',' ')),String(A.when||'').replace('T',' ')],
    ['발생 장소',esc(A.place),A.place],

      actIssues.length?actIssues.map(([row,x])=>`${x}: ${row}`).join(' / '):((A.acts||[]).length?'미이행·확인 불가 항목 없음':'')],
    ['위반 법령 · 조문',v.length?v.map(x=>`<b>${esc(violLabel(x))}</b>${x.articleTitle?` (${esc(x.articleTitle)})`:''}${x.gap?` — ${esc(x.gap)}`:''}`).join('<br>'):'',v.map(x=>`${violLabel(x)}${x.articleTitle?` (${x.articleTitle})`:''}${x.gap?` — ${x.gap}`:''}`).join(' / ')],
    ['처벌 조항',pens.length?pens.map(x=>`${esc(violLabel(x))}: <b style="color:var(--red)">${esc(x.penalty)}</b>`).join('<br>'):(v.length?'등록된 처벌 조항 없음 (확인 필요)':''),
      pens.map(x=>`${violLabel(x)}: ${x.penalty}`).join(' / ')||(v.length?'등록된 처벌 조항 없음 (확인 필요)':'')],

async function aiSummary(){
  const list=S.resp.accident,r=list.find(x=>x.id===S.sumId);if(!r||!ready())return;
  const text=summaryItems(r).map(([k,,t],i)=>`${i+1}. ${k}: ${t||'기록 없음'}`).join('\n');
  const st=S.aiSum[r.id]={busy:true,text:'',err:''};renderMain();
  try{const data=await callAI({task:'summary',text:text.slice(0,12000)});st.text=String(data.text||'');if(!st.text)st.err='요약을 받지 못했습니다. 다시 시도하세요.';}
  catch(e){st.err=aiErrorText(e);}
  finally{st.busy=false;renderMain();}
}

function resultTabs(form){
  const t=[['summary','문항별 집계'],['stats','통계']];

}
function gateCard(){
  if(S.conn==='pending')return `<div class="card empty"><b>불러오는 중</b><span>잠시만 기다려 주세요.</span></div>`;
  if(S.conn==='setup')return setupCard();
  if(S.conn==='error')return `<div class="card empty"><b>연결하지 못했습니다</b><span>${esc(S.connErr||'잠시 후 새로고침해 주세요.')}</span></div>`;
  if(S.conn==='signedout')return `<div class="card empty"><b>로그인이 필요합니다</b><span>사고 기록은 로그인한 사람만 볼 수 있습니다.</span><button class="btn primary" data-act="signIn" ${S.signingIn?'disabled':''}>Google 로그인</button></div>`;

function setupCard(){
  return `<div class="card"><h2 style="margin:0">Firebase 설정이 필요합니다</h2>

    <ol class="steps"><li>Firebase 프로젝트를 만들고 Blaze 요금제로 전환</li><li>Authentication에서 Google 로그인 켜기, 승인된 도메인에 <code>namuapplication.cloud</code> 추가</li>
    <li>Firestore·Storage 만들고 보안 규칙 배포</li><li>웹 앱 설정값을 <code>korail/firebase-config.js</code>에 붙여넣기</li><li>Claude API 키를 비밀값으로 등록하고 Functions 배포</li></ol></div>`;

      ${form.sections.map(s=>`<div class="card"><h3 style="margin:0">${esc(s.title)}</h3>${s.fields.map(f=>`<div class="ans"><span class="k">${esc(f.label)}</span><div class="v">${answerHTML(f,r.answers?.[f.id])}</div></div>`).join('')}</div>`).join('')}`;

    <div class="table-wrap"><table><thead><tr><th>제출 시각</th><th>작성자</th>${cols.map(c=>`<th>${esc(c.label)}</th>`).join('')}</tr></thead><tbody>
    ${list.map((r,i)=>`<tr class="rowlink" data-act="openEach" data-i="${i}" style="cursor:pointer"><td class="mono">${fmtTime(r.submittedAt)}</td><td>${esc(r.byName||r.byEmail||'')}</td>${cols.map(c=>`<td>${esc(cellText(c,r.answers))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
  return `<div class="col wide"><div class="res-head"><div><div class="eyebrow">결과</div><h1>${esc(form.name)}</h1>
    <p>응답 <b class="mono">${ready()?list.length:'–'}</b>개${last?` · 마지막 제출 <span class="mono">${fmtTime(last)}</span>`:''}</p></div>
    <button class="btn" data-act="mode" data-m="fill">응답 작성</button></div>
    <div class="subtabs" role="group" aria-label="결과 보기 방식">${tabs.map(([k,l])=>`<button type="button" data-act="tab" data-t="${k}" aria-pressed="${S.tab===k}">${l}</button>`).join('')}</div>
    ${body}</div>`;
}
function downloadCSV(){
  const form=curForm(),cols=tableCols(form),list=S.resp[form.id];
  const q=s=>`"${String(s).replace(/"/g,'""')}"`;
  const lines=[['제출 시각','작성자',...cols.map(c=>c.label)].map(q).join(',')];
  list.forEach(r=>lines.push([fmtTime(r.submittedAt),r.byName||r.byEmail||'',...cols.map(c=>cellText(c,r.answers))].map(q).join(',')));
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  const d=new Date();a.download=`${form.name}_응답_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.csv`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('CSV 파일을 내려받았습니다');
}

function parseArticles(text){
  const re=/(^|\n)[ \t]*(제\s*\d+\s*조(?:\s*의\s*\d+)?)[ \t]*(?:\(([^)\n]{1,60})\))?/g;
  let hits=[];let m;while((m=re.exec(text))){hits.push({at:m.index+m[1].length,end:re.lastIndex,no:m[2].replace(/\s+/g,''),title:m[3]||''});}
  /* 제목이 붙은 조문이 있으면 제목 없는 줄머리 인용(예: '제40조의2 제2항을 …')은 조문으로 보지 않음 */
  if(hits.some(h=>h.title))hits=hits.filter(h=>h.title);
  return hits.map((h,i)=>({no:h.no,title:h.title.trim(),text:text.slice(h.end,i+1<hits.length?hits[i+1].at:text.length).trim()})).filter(a=>a.no);
}

  claimAdmin:async()=>{const {db,fs}=S.fb;const me=(S.user.email||'').toLowerCase();
    try{await fs.setDoc(fs.doc(db,'settings','admins'),{emails:[me]});toast('관리자로 등록했습니다');}
    catch(e){toast(errCode(e)==='permission-denied'?'이미 관리자가 있어 등록할 수 없습니다':'등록하지 못했습니다');}},
  addAdmin:async()=>{const e=val('admin-email').toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){toast('이메일 주소를 확인하세요');return;}
    if(S.admins.includes(e)){toast('이미 관리자입니다');return;}const {db,fs}=S.fb;
    try{await fs.setDoc(fs.doc(db,'settings','admins'),{emails:[...S.admins,e]});toast('관리자를 추가했습니다');}catch(err){toast('추가하지 못했습니다');}},
  rmAdmin:async el=>{const e=el.dataset.e;if(S.adminDel!==e){S.adminDel=e;renderMain();return;}S.adminDel=null;const {db,fs}=S.fb;
    try{await fs.setDoc(fs.doc(db,'settings','admins'),{emails:S.admins.filter(x=>x!==e)});toast('관리자에서 뺐습니다');}catch(err){toast('바꾸지 못했습니다');}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;ACT[el.dataset.act]?.(el,e);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#lb').hidden)ACT.lbClose();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr.rowlink')){e.preventDefault();e.target.click();}});
document.addEventListener('error',e=>{if(e.target&&e.target.tagName==='IMG')e.target.classList.add('broken');},true);
document.addEventListener('submit',e=>{if(e.target.id==='form'){e.preventDefault();submit();}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.input==='paste'){const n=parseArticles(t.value);const p=$('#paste-preview');if(p)p.textContent=n.length?`조문 ${n.length}개를 찾았습니다: ${n.slice(0,6).map(a=>a.no+(a.title?`(${a.title})`:'')).join(', ')}${n.length>6?' 외':''}`:'‘제○조’로 시작하는 줄을 찾지 못했습니다.';return;}
  if(t.closest('#form')){
    if(t.dataset.v&&t.tagName!=='SELECT'){const rows=S.viol[S.form];if(rows&&rows[+t.dataset.i])rows[+t.dataset.i][t.dataset.v]=t.value;}
    saveDraft();const c=t.closest('.q.err');if(c){c.classList.remove('err');c.querySelector('.q-err').hidden=true;}
    if(t.classList.contains('other')&&t.value){const r=t.closest('.opt').querySelector('input[value="__other"]');if(r)r.checked=true;}}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.chg==='statYear'){S.statYear=t.value;renderMain();return;}
  if(t.dataset.chg==='sumSel'){S.sumId=t.value;renderMain();return;}
  if(t.matches('[data-photo]')){const files=[...t.files];t.value='';if(files.length&&ready())uploadPhotos(files);return;}
  if(t.closest('#form')){if(t.tagName==='SELECT'&&t.dataset.v){onViolChange(t);return;}
    saveDraft();const c=t.closest('.q.err');if(c){c.classList.remove('err');c.querySelector('.q-err').hidden=true;}}});

/* ───────── Firebase 연결 ───────── */
async function signIn(){
  if(!S.fb||S.signingIn)return;const {auth,au}=S.fb;
  S.signingIn=true;renderBar();
  const provider=new au.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});
  try{await au.signInWithPopup(auth,provider);}
  catch(e){const c=errCode(e);
    if(c==='popup-blocked'||c==='operation-not-supported-in-this-environment'){try{await au.signInWithRedirect(auth,provider);return;}catch(e2){toast('로그인 창을 열지 못했습니다');}}
    else if(c==='unauthorized-domain')toast('이 주소가 Firebase 승인 도메인에 없습니다. 관리자에게 알려 주세요');
    else if(c!=='popup-closed-by-user'&&c!=='cancelled-popup-request')toast('로그인하지 못했습니다. 다시 시도하세요');}
  finally{S.signingIn=false;renderBar();}
}
function stopSubs(){S.unsubs.forEach(u=>{try{u();}catch(e){}});S.unsubs=[];}
function startSubs(){
  const {db,fs}=S.fb;stopSubs();
  FORMS.forEach(f=>{
    S.unsubs.push(fs.onSnapshot(fs.query(fs.collection(db,'forms',f.id,'responses'),fs.orderBy('submittedAt','desc'),fs.limit(1000)),snap=>{
      S.resp[f.id]=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded[f.id]=true;delete S.err[f.id];onData(f.id);
    },err=>{S.err[f.id]=errCode(err)||'unavailable';onData(f.id);}));
  });
  S.unsubs.push(fs.onSnapshot(fs.collection(db,'regs'),snap=>{
    S.regs=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0)||String(a.name).localeCompare(String(b.name)));S.regsLoaded=true;
    if(S.mode==='regs'){if(!S.regEdit)renderMain();}else if(S.mode==='fill')renderViol();
  },()=>{S.regsLoaded=true;if(S.mode==='regs')renderMain();}));
  S.unsubs.push(fs.onSnapshot(fs.doc(db,'settings','admins'),snap=>{
    S.adminsExists=snap.exists();S.admins=(snap.exists()&&Array.isArray(snap.data().emails)?snap.data().emails:[]).map(e=>String(e).toLowerCase());S.adminsLoaded=true;
    renderBar();if(S.mode!=='fill'&&!S.regEdit)renderMain();
  },()=>{S.adminsLoaded=true;}));
}
function onData(fid){
  renderBar();
  if(S.mode==='results'&&fid===S.form&&!(S.aiSum[S.sumId]&&S.aiSum[S.sumId].busy))renderMain();
}
async function boot(){
  const filled=firebaseConfig&&firebaseConfig.apiKey&&firebaseConfig.projectId;
  if(!filled){S.conn='setup';renderMainKeep();return;}
  try{
    const [app,au,fs,st,fnm]=await Promise.all(['firebase-app','firebase-auth','firebase-firestore','firebase-storage','firebase-functions'].map(n=>import(FB+n+'.js')));
    const fbApp=app.initializeApp(firebaseConfig);
    const auth=au.getAuth(fbApp);
    const functions=fnm.getFunctions(fbApp,functionsRegion);
    S.fb={app:fbApp,auth,au,db:fs.getFirestore(fbApp),fs,storage:st.getStorage(fbApp),st,
      fn:{claudeCall:fnm.httpsCallable(functions,'claude',{timeout:180000})}};
    au.getRedirectResult(auth).catch(()=>{});
    au.onAuthStateChanged(auth,user=>{
      S.user=user||null;
      if(user){S.conn='ready';startSubs();}
      else{S.conn='signedout';stopSubs();FORMS.forEach(f=>{S.resp[f.id]=[];S.loaded[f.id]=false;});S.regs=[];S.regsLoaded=false;S.admins=[];S.adminsLoaded=false;S.adminsExists=false;}
      renderMainKeep();
    });
  }catch(e){S.conn='error';S.connErr='Firebase를 불러오지 못했습니다. 네트워크를 확인한 뒤 새로고침해 주세요.';renderMainKeep();}
}

/* ───────── 시작 ───────── */
(function(){const h=(location.hash||'').slice(1);if(h==='regs'){S.mode='regs';return;}const m=h.match(/^([a-z]+)(-results)?$/);
  if(m&&FORMS.some(f=>f.id===m[1])){S.form=m[1];if(m[2])S.mode='results';}})();
renderMain();
boot();
</script>
